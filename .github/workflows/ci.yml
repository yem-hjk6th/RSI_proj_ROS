name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-pytest python3-pandas
          rosdep update
          rosdep install --from-paths src --ignore-src -y
      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_cohesion+
      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_cohesion+
          colcon test-result --verbose

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the deploy image (build only)
        run: docker build -f deploy/Dockerfile -t rsi-proj-ros:ci .
      - name: Smoke-check the image
        run: |
          docker run --rm rsi-proj-ros:ci ros2 pkg list | grep -x krc_eki_bridge
          docker run --rm rsi-proj-ros:ci ros2 pkg list | grep -x krc_interfaces
      - name: Validate compose file
        run: docker compose -f deploy/compose.yaml config --quiet

  # The pure-Python core and its tests on the operating system of the lab laptop: no colcon, no ROS (every test that
  # needs rclpy or the messages skips itself). Each package is run from its own folder, as colcon test does.
  windows-pytest:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pytest numpy pandas scipy matplotlib pyyaml opencv-python-headless
      - name: Test (pytest per package)
        run: |
          $pkgs = Get-ChildItem src -Directory | Where-Object { Test-Path (Join-Path $_.FullName "setup.py") }
          $env:PYTHONPATH = ($pkgs | ForEach-Object { $_.FullName }) -join ";"
          $env:MPLBACKEND = "Agg"
          $failed = @()
          foreach ($p in $pkgs) {
            Write-Host "=== $($p.Name)"
            Push-Location $p.FullName
            python -m pytest -q -rs -p no:cacheprovider test
            if ($LASTEXITCODE -ne 0) { $failed += $p.Name }
            Pop-Location
          }
          if ($failed.Count -gt 0) { Write-Host "failed: $($failed -join ', ')"; exit 1 }
