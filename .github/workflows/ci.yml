name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-pytest python3-pandas
          rosdep update
          rosdep install --from-paths src --ignore-src -y
      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_cohesion+
      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_cohesion+
          colcon test-result --verbose

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the deploy image (build only)
        run: docker build -f deploy/Dockerfile -t rsi-proj-ros:ci .
      - name: Smoke-check the image
        run: |
          docker run --rm rsi-proj-ros:ci ros2 pkg list | grep -x krc_eki_bridge
          docker run --rm rsi-proj-ros:ci ros2 pkg list | grep -x krc_interfaces
      - name: Validate compose file
        run: docker compose -f deploy/compose.yaml config --quiet

  # The pure-Python packages and their tests on the operating system of the lab laptop: no colcon, no ROS (every test
  # that needs rclpy, the messages or rosbag2 skips itself). Each package is run from its own folder, as colcon test
  # does. Not run here: the edge-PC packages, which are Linux by design (docs/DESIGN.md section 3): camera_capture
  # (V4L2, fcntl locks of session_meta.json) and krc_rsi_bridge, krc_sim, krc_eki_bridge, krc_replay (4 ms RSI / EKI
  # timing on loopback, which the Windows timer resolution does not meet).
  windows-pytest:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # OpenCV below 5, like the 4.x of Ubuntu 24.04 in build-test. OpenCV 5's cv2.remap interpolates float maps at the
      # full position (OpenCV 4: 1/32 px, fixed-point weights), up to 0.007 mm on the E1 widths. The ELP port samples
      # with readout.remap_linear (the OpenCV 4 result on 4 and 5), so test_golden and test_cli pass on OpenCV 5, but the
      # tests that run the legacy readouts live (float-map cv2.remap) would compare against OpenCV 5 values there.
      - name: Install dependencies
        run: python -m pip install pytest numpy pandas scipy matplotlib pyyaml "opencv-python-headless<5"
      - name: Test (pytest per package)
        run: |
          $all = Get-ChildItem src -Directory | Where-Object { Test-Path (Join-Path $_.FullName "setup.py") }
          $env:PYTHONPATH = ($all | ForEach-Object { $_.FullName }) -join ";"
          $names = "cl_controller", "path_geometry", "print_session", "width_readout_bore1", "width_readout_elp"
          $pkgs = $all | Where-Object { $names -contains $_.Name }
          if ($pkgs.Count -ne $names.Count) { Write-Host "missing package folders"; exit 1 }
          $env:MPLBACKEND = "Agg"
          $failed = @()
          foreach ($p in $pkgs) {
            Write-Host "=== $($p.Name)"
            Push-Location $p.FullName
            python -m pytest -q -rs -p no:cacheprovider test
            if ($LASTEXITCODE -ne 0) { $failed += $p.Name }
            Pop-Location
          }
          if ($failed.Count -gt 0) { Write-Host "failed: $($failed -join ', ')"; exit 1 }

  # width_readout_elp on OpenCV 5 (Linux, Python 3.12, no ROS). On OpenCV 4, which every other job runs, remap_linear
  # and the float-map cv2.remap give the same result, so test_remap.py cannot catch a revert of remap_linear there. On
  # OpenCV 5 the float-map remap interpolates at the full position, and test_remap.py, test_golden.py and test_cli.py
  # fail if remap_linear is reverted. The wheel is pinned to an exact 5.x version. pandas, scipy and pyyaml are needed
  # to collect the package's tests; path_geometry is on PYTHONPATH for the fan / semicircle readout.
  # Deselected: the nine tests that run the legacy modules live. The legacy readouts call cv2.remap on float maps, so
  # on OpenCV 5 they no longer give what the legacy gave when it ran (OpenCV 4.x); the README, "OpenCV versions":
  #   test_legacy_live.py::test_port_matches_legacy_live
  #   test_walls.py::test_plane_lift_matches_legacy_ml
  #   test_path_readout.py::test_read_equals_legacy_on_synthetic_images[A-fan1|A-arc2|B-fan1|B-arc2]
  #   test_elp_b.py::test_read_equals_legacy_on_synthetic_images[pos|both|neg]
  elp-opencv5:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pytest numpy pandas scipy pyyaml "opencv-python-headless==5.0.0.93"
      - name: Test width_readout_elp on OpenCV 5
        working-directory: src/width_readout_elp
        env:
          PYTHONPATH: ../path_geometry
        run: |
          python -c "import cv2, sys; print(cv2.__version__); sys.exit(cv2.__version__.split('.')[0] != '5')"
          python -m pytest -q -rs -p no:cacheprovider test \
            --deselect "test/test_legacy_live.py::test_port_matches_legacy_live" \
            --deselect "test/test_walls.py::test_plane_lift_matches_legacy_ml" \
            --deselect "test/test_path_readout.py::test_read_equals_legacy_on_synthetic_images[A-fan1]" \
            --deselect "test/test_path_readout.py::test_read_equals_legacy_on_synthetic_images[A-arc2]" \
            --deselect "test/test_path_readout.py::test_read_equals_legacy_on_synthetic_images[B-fan1]" \
            --deselect "test/test_path_readout.py::test_read_equals_legacy_on_synthetic_images[B-arc2]" \
            --deselect "test/test_elp_b.py::test_read_equals_legacy_on_synthetic_images[pos]" \
            --deselect "test/test_elp_b.py::test_read_equals_legacy_on_synthetic_images[both]" \
            --deselect "test/test_elp_b.py::test_read_equals_legacy_on_synthetic_images[neg]"
