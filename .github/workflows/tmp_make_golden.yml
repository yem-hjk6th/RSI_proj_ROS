# TEMPORARY (PR #5): regenerate the width_readout_elp golden fixture in the CI image. Remove before merging.
name: tmp-make-golden

on:
  push:
    branches: [claude/gracious-bohr-rf4c34]
    paths: [.github/workflows/tmp_make_golden.yml]

jobs:
  make-golden:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (same as ci.yml)
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-pytest python3-pandas
          rosdep update
          rosdep install --from-paths src --ignore-src -y
      - name: Environment
        run: |
          python3 -c "import cv2, numpy, scipy, pandas; print('cv2', cv2.__version__, 'numpy', numpy.__version__, 'scipy', scipy.__version__, 'pandas', pandas.__version__)"
          dpkg-query -W python3-opencv 'libopencv-imgcodecs*' 'libjpeg-turbo8*' || true
      - name: Make golden
        run: |
          python3 src/width_readout_elp/test/make_golden.py
          sha256sum src/width_readout_elp/test/fixtures/golden_legacy_e1.csv
          echo "BEGIN_GOLDEN_B64"
          gzip -9n -c src/width_readout_elp/test/fixtures/golden_legacy_e1.csv | base64 -w 120
          echo "END_GOLDEN_B64"
      - uses: actions/upload-artifact@v4
        with:
          name: golden_legacy_e1
          path: src/width_readout_elp/test/fixtures/golden_legacy_e1.csv
