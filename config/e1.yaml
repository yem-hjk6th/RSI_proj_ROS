# Parameter set of session E1 (data/e1_20261022_165128, 2026-10-22, closed loop, plan A_b1).
# Recovered from raw_video/session_meta.json ("realtime": cfg, law, speed), roboter/eval_v3_*.json (plan A_b1, order
# bore1 -> elp, W* 5.25), the ctrl_*.csv.gz header (v3 columns up to lnk_ol: version realtime_cl_261022, so no
# du_blind / t_blind = blind_tau 0) and the run_cl.py defaults for everything E1 did not override.
# Derived at start-up from the pattern (not set here): V_max 30 mm/s, ov_base 40.0, ov_default 40,
# speed floor ceil(3.4 x 100 / 30) = 12, so the window is 12..100.
#
# Usage: ros2 run cl_controller controller_node --ros-args --params-file config/e1.yaml
#        ros2 launch print_session bringup.launch.py mode:=shadow params_file:=config/e1.yaml   (the whole edge stack)
# The bringup takes `mode` from its launch argument, not from this file. It derives the bridge's limits and pattern
# from the cl_controller section.
cl_controller:
  ros__parameters:
    mode: closed
    pattern: pattern_usr_ELP_R1v30_CLp_261022.json   # resolved against the package's patterns/ folder
    root: ""
    w12_t: 0.0                 # not given (alias of w_target)
    w_target: 5.25             # cfg.w12_t
    alpha_m: 0.72
    ov_outside: 100
    ov_min: 1                  # outer limit (speed.ov_min_outer); raised to the floor 12
    ov_max: 100
    ov_base: 0.0               # derived: 12 x 100 / 30 = 40.0 (speed.ov_base_given null)
    v_ref_mm_s: 12.0
    v_start_mm_s: 12.0
    open_loop_schedule_mm_s: ""
    v_min_mm_s: 3.4
    fallback_ramp_s: 2.0
    window_ignore_z: false
    limit_probe: -1
    plan: A_b1
    primary: ""
    target: const
    force_seg: ""
    b1_win_mm: 1.5
    gain: 1.0
    db: 0.02
    ack: false
    u0: 0.0
    tau_slow: 20.0
    tau_model: 0.0
    start_mix: 1.0
    blind_tau: 0.0
    blind_ref: prev
    blind_dir: up
    guard_bed: true
    target_schedule: const
    speed_check: latch
    step_period_s: 0.05

# RSI bridge (krc_rsi_bridge). The bringup sets mode, pattern_file, ov_min / ov_max / ov_outside / ov_default,
# v_min_mm_s, fallback_ramp_s, wd_s, the window tolerances, step_seq / step_hold_s and tau_v from cl_controller and
# refuses a different value here. Only the network and real-time settings belong in this section.
krc_rsi_bridge:
  ros__parameters:
    host: 0.0.0.0              # placeholder: the edge PC's address on the KRC network (RSI_EthernetConfig.xml)
    port: 59152                # placeholder: the port in RSI_EthernetConfig.xml
    deadline_s: 0.004
    rt_priority: 0             # SCHED_FIFO priority of the reply process on the edge PC; 0 = not set
    cpu: -1                    # pin the reply process to this CPU; -1 = no pinning
    ring_capacity: 8192
    publish_period_s: 0.01
    k_chord: 25

# ELP readout (width_readout_elp). The bringup sets image_topic (launch argument) and pattern_json (the controller's
# pattern); rig_json empty = the packaged CAGE1012 rig.
width_readout_elp:
  ros__parameters:
    camera: elp
    state_topic: /krc/state
    width_topic: /width/elp
    rig_json: ""
    root: ""
    d_min: 12.0
    use_header_stamp: true     # the image stamp is the capture time (usb_cam: V4L2 buffer time)

# Session node (print_session).
print_session:
  ros__parameters:
    # E1 ran plan A_b1 (bore1 first). The bringup refuses it unless a bore1 readout publishes /width/bore1
    # (legacy run_cl.py refused it when the bore1 head did not load). width_readout_bore1 is not in this repository
    # yet, so this stays false: to run this file without bore1, set cl_controller plan: A.
    bore1_readout: false
    disconnect_timeout_s: 2.0  # E1 session_meta rsi.disconnect_timeout_s
    src_name: usr_ELP_R1v30_CLp_261022.src   # the program E1 ran (session_meta src_name)
    ceiling_light: "on"        # E1 session_meta ceiling_light
