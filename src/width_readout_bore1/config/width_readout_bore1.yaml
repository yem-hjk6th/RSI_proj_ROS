# Example parameters for the width_readout_bore1 node. The weights are not in this repository: weight_dir is a
# placeholder for the folder with cnxt_t_deploy_s0.pt .. s2.pt (checked against config/weights_sha256.json).
width_readout_bore1:
  ros__parameters:
    camera: bore1
    image_topic: /bore1/image_raw
    state_topic: /krc/state
    width_topic: /width/bore1
    record_topic: /width/bore1/record
    pattern_json: ""            # empty = width_readout_elp's packaged R1v30_CLp pattern (the bringup sets the session's)
    root: ""
    head: torch                 # torch | replay
    weight_dir: <BORE1_WEIGHT_DIR>
    quality_json: ""            # empty = the packaged copy of the legacy quality_limits.json
    device: cuda
    mem_frac: 0.0
    warmup: 5
    replay_csv: ""              # head replay: a bore1_rt_<ses>.csv(.gz)
    replay_tol_s: 1.0e-6
    frame_time: receive         # receive | header (header.stamp + header_offset_s)
    header_offset_s: 0.0
    wait_s: 0.06
    drop_bad_q: true
    sd_max: .inf
    session_meta: ""
