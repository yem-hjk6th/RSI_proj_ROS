# Example parameters for the width_readout_elp node. Empty rig_json / pattern_json = the packaged copies of the
# legacy rig (CAGE1012) and the R1v30_CLp pattern.
width_readout_elp:
  ros__parameters:
    camera: elp
    image_topic: /elp/image_raw
    state_topic: /krc/state
    width_topic: /width/elp
    rig_json: ""
    pattern_json: ""          # a path, or a file name in path_geometry patterns/ (FAN1, ARC2)
    root: ""
    d_min: 12.0
    use_header_stamp: true
    gate_log_dir: ""          # semi patterns: gate log folder; empty = the folder of session_meta (no log without it)
    session_meta: ""          # the session's session_meta.json (print_session sets it); its folder holds the gate log
    kind: A                   # A = ELP-A on the -X legs; B = ELP-B on the +X lines (cage 2, see width_readout_elp_b.yaml)
    b_mdf_side: pos           # kind B: MDF reference half (pos | both | neg)
